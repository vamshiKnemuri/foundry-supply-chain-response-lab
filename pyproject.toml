[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-supply-chain-response-lab"
version = "0.1.0"
description = "An evidence-first agentic supply-chain response lab with a Foundry ontology integration blueprint"
requires-python = ">=3.10"
authors = [{name = "Vamshi K N"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["agentic-ai", "palantir-foundry", "ontology", "aip", "supply-chain", "human-in-the-loop"]

[project.scripts]
response-lab = "response_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

